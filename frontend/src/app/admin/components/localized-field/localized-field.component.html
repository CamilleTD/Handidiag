<fieldset class="lang-pair">
  <legend>
    {{ label() }}
    @if (required()) {
      <span aria-hidden="true"> *</span>
    }
  </legend>
  @if (hint()) {
    <p class="hint" [id]="id + '-hint'">{{ hint() }}</p>
  }
  @for (lang of langs; track lang) {
    <div class="lang-row">
      <label class="lang-code" [for]="id + '-' + lang" [title]="t('field.lang_' + lang)">{{
        lang.toUpperCase()
      }}</label>
      @if (multiline()) {
        <textarea
          class="text-input"
          [id]="id + '-' + lang"
          [attr.lang]="lang"
          [attr.aria-label]="label() + ' (' + t('field.lang_' + lang) + ')'"
          [attr.aria-describedby]="hint() ? id + '-hint' : null"
          [required]="required() && lang === 'fr'"
          [value]="current()[lang]"
          (input)="set(lang, $event)"
        ></textarea>
      } @else {
        <input
          class="text-input"
          [id]="id + '-' + lang"
          [attr.lang]="lang"
          [attr.aria-label]="label() + ' (' + t('field.lang_' + lang) + ')'"
          [attr.aria-describedby]="hint() ? id + '-hint' : null"
          [required]="required() && lang === 'fr'"
          [value]="current()[lang]"
          (input)="set(lang, $event)"
        />
      }
    </div>
  }
</fieldset>
