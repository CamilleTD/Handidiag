# Intégration continue : lint, tests et build à chaque push et pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: API (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q

  migrations:
    name: API (migrations PostgreSQL, démarrage)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: handidiag
          POSTGRES_USER: handidiag
          POSTGRES_PASSWORD: handidiag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handidiag -d handidiag"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://handidiag:handidiag@127.0.0.1:5432/handidiag
      ADMIN_PASSWORD: Ci-Password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      # Les tests utilisent SQLite : on vérifie ici que les migrations s'appliquent sur PostgreSQL
      - name: Migrations
        run: aerich upgrade
      - name: Démarrage et contenu de départ
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/content > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/content | python -c "import json,sys; d=json.load(sys.stdin); assert d['questionnaires'], d"
          curl -sf http://127.0.0.1:8000/api/questionnaires/rqth > /dev/null

  frontend:
    name: Interface (format, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Format
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        # build.mjs contourne un `ng build` qui ne rend pas toujours la main (voir le fichier)
        run: node build.mjs

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
